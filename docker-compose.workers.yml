# Optional monitoring. Workers are included in the primary compose file.
services:
  flower:
    image: wst-image:${WST_IMAGE_TAG:-pre-release}
    restart: unless-stopped
    command: [celery, -A, app.flower_app, flower, --port=5555]
    environment:
      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-wst}:${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      FLOWER_BASIC_AUTH: ${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?Set FLOWER_PASSWORD}
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      rabbitmq:
        condition: service_healthy
