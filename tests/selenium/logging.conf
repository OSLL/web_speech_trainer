# Logging config for selenium tests: INFO to stdout, DEBUG to file.
# %(log_file)s is passed from conftest.py (defaults of logging.config.fileConfig).

[loggers]
keys=root,selenium,urllib3

[handlers]
keys=console,file

[formatters]
keys=default

[logger_root]
level=DEBUG
handlers=console,file

# selenium and urllib3 log every webdriver command on DEBUG level
[logger_selenium]
level=INFO
handlers=
qualname=selenium

[logger_urllib3]
level=INFO
handlers=
qualname=urllib3

[handler_console]
class=StreamHandler
level=INFO
formatter=default
args=(sys.stdout,)

[handler_file]
class=FileHandler
level=DEBUG
formatter=default
args=('%(log_file)s', 'w', 'utf-8')

[formatter_default]
format=%(asctime)s [%(levelname)s] %(name)s: %(message)s
datefmt=%Y-%m-%d %H:%M:%S
